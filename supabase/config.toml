project_id = "planning-idel"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 14

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.send_email]
enabled = true
uri = "pg-functions://postgres/public/idel_block_auth_email"

[db.seed]
enabled = false
